server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 리다이렉트 Location을 상대 경로로 발급.
    # TLS를 앞단 Nginx Gateway Fabric에서 끊고 백엔드로는 HTTP로 프록시하기 때문에,
    # 절대 URL로 만들면 이 파드의 nginx가 자기가 보는 스킴(http)을 박아 https -> http 다운그레이드가 발생함.
    # 상대 경로면 클라이언트가 원래 요청 URL 기준으로 해석하므로 스킴/호스트가 그대로 유지됨.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;

    # 해시가 붙은 정적 에셋은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
